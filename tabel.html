<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Layout</title>
</head>

<body>

    <table border="1" cellspacing="7" cellpadding="10" width="550">

        <!-- BARIS 1 -->
        <tr>
            <td colspan="6" height="45">1</td>

            <td colspan="2" rowspan="3">2</td>

            <td colspan="4">3</td>

            <td colspan="2" rowspan="2">N</td>
        </tr>

        <!-- BARIS 2 -->
        <tr>
            <td colspan="2" height="30">4</td>
            <td colspan="2">5</td>
            <td colspan="2">6</td>

            <td colspan="2">7</td>
            <td colspan="2">8</td>
        </tr>

        <!-- BARIS 3 -->
        <tr>
            <td colspan="6" height="45">9</td>

            <td colspan="4">10</td>

            <td colspan="2">N</td>
        </tr>

        <!-- BARIS 4 -->
        <tr>
            <td colspan="14" height="45">N</td>
        </tr>

        <!-- BARIS 5 -->
        <tr>
            <td colspan="2" height="30">N</td>
            <td colspan="2">N</td>
            <td colspan="2">N</td>
            <td colspan="2">N</td>
            <td colspan="2">N</td>
            <td colspan="2">N</td>
            <td colspan="2">N</td>
        </tr>

    </table>

</body>

</html>
