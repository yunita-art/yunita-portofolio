<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Siswa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- FORM TAMBAH/EDIT DATA -->
        <div class="bg-white rounded-xl border border-slate-300 p-6 shadow-sm">
            <div class="flex items-center gap-2 mb-6 pb-3 border-b border-slate-200">
                <i class="fa-solid fa-user-plus text-slate-700"></i>
                <h2 class="text-base font-bold text-slate-900" id="formTitle">Tambah Data Siswa</h2>
            </div>

            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Kolom Kiri -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">NIS</label>
                            <input type="text" id="nis" required placeholder="Masukkan NIS" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="nama" required placeholder="Masukkan nama lengkap" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Kelas</label>
                            <select id="kelas" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:bg-white">
                                <option value="">Pilih kelas</option>
                                <option value="X RPL 1">X RPL 1</option>
                                <option value="X RPL 2">X RPL 2</option>
                                <option value="X RPL 3">X RPL 3</option>
                                <option value="XI RPL 1">XI RPL 1</option>
                            </select>
                        </div>
                    </div>

                    <!-- Kolom Kanan -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis Kelamin</label>
                            <div class="flex items-center gap-6 pt-2">
                                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                                    <input type="radio" name="gender" value="Laki-laki" checked class="accent-slate-900"> Laki-laki
                                </label>
                                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                                    <input type="radio" name="gender" value="Perempuan" class="accent-slate-900"> Perempuan
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Lahir</label>
                            <input type="date" id="tglLahir" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:bg-white">
                        </div>
                    </div>
                </div>

                <!-- Tombol Form -->
                <div class="flex items-center gap-3 mt-6">
                    <button type="submit" id="btnSubmit" class="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-plus text-xs"></i> Simpan
                    </button>
                    <button type="button" id="btnReset" class="px-5 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right text-xs"></i> Reset
                    </button>
                </div>
            </form>
        </div>

        <!-- TABEL DATA SISWA -->
        <div class="bg-white rounded-xl border border-slate-300 shadow-sm overflow-hidden">
            
            <!-- Header Tabel & Pencarian -->
            <div class="p-4 sm:p-5 border-b border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list text-slate-700"></i>
                    <h2 class="text-base font-bold text-slate-900">Data Siswa</h2>
                </div>
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama atau NIS..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                </div>
            </div>

            <!-- Elemen Tabel -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-700">
                    <thead class="bg-slate-100 border-b border-slate-300 text-xs font-bold text-slate-800">
                        <tr>
                            <th class="px-4 py-3 text-center w-12">No</th>
                            <th class="px-4 py-3">NIS</th>
                            <th class="px-4 py-3">Nama Lengkap</th>
                            <th class="px-4 py-3">Kelas</th>
                            <th class="px-4 py-3">Jenis Kelamin</th>
                            <th class="px-4 py-3">Tanggal Lahir</th>
                            <th class="px-4 py-3 text-center w-28">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-slate-200">
                        <!-- Data otomatis dipanggil oleh JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Footer & Navigasi -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600">
                <span id="dataInfo">Menampilkan 1 - 5 dari 5 data</span>
                <div class="flex items-center gap-1">
                    <button class="w-7 h-7 flex items-center justify-center border border-slate-300 rounded bg-white text-slate-500 hover:bg-slate-100 disabled:opacity-50" disabled>
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                    </button>
                    <button class="w-7 h-7 flex items-center justify-center rounded bg-slate-900 text-white font-medium">1</button>
                    <button class="w-7 h-7 flex items-center justify-center border border-slate-300 rounded bg-white text-slate-500 hover:bg-slate-100 disabled:opacity-50" disabled>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT HASIL INTEGRASI -->
    <script>
        let students = [
            { nis: "001", nama: "Andi Setiawan", kelas: "X RPL 1", gender: "Laki-laki", tglLahir: "2008-01-15" },
            { nis: "002", nama: "Budi Santoso", kelas: "X RPL 1", gender: "Laki-laki", tglLahir: "2008-03-22" },
            { nis: "003", nama: "Citra Lestari", kelas: "X RPL 2", gender: "Perempuan", tglLahir: "2008-07-10" },
            { nis: "004", nama: "Deni Pratama", kelas: "X RPL 2", gender: "Laki-laki", tglLahir: "2008-09-05" },
            { nis: "005", nama: "Eka Wijaya", kelas: "X RPL 3", gender: "Perempuan", tglLahir: "2008-11-18" }
        ];

        function renderTable() {
            const tbody = document.getElementById("studentTableBody");
            const searchVal = document.getElementById("searchInput").value.toLowerCase();
            tbody.innerHTML = "";

            const filtered = students.filter(s => 
                s.nama.toLowerCase().includes(searchVal) || 
                s.nis.toLowerCase().includes(searchVal)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-slate-500">Data tidak ditemukan</td></tr>`;
            } else {
                filtered.forEach((student, index) => {
                    const originalIndex = students.indexOf(student);
                    const row = document.createElement("tr");
                    row.className = "hover:bg-slate-50 transition border-b border-slate-200";
                    row.innerHTML = `
                        <td class="px-4 py-3 text-center text-slate-600">${index + 1}</td>
                        <td class="px-4 py-3 font-semibold text-slate-900">${student.nis}</td>
                        <td class="px-4 py-3 font-medium text-slate-800">${student.nama}</td>
                        <td class="px-4 py-3 text-slate-700">${student.kelas}</td>
                        <td class="px-4 py-3 text-slate-700">${student.gender}</td>
                        <td class="px-4 py-3 text-slate-700">${student.tglLahir}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center gap-1.5">
                                <button onclick="editStudent(${originalIndex})" class="w-7 h-7 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-white rounded transition" title="Edit">
                                    <i class="fa-solid fa-pen text-[10px]"></i>
                                </button>
                                <button onclick="deleteStudent(${originalIndex})" class="w-7 h-7 flex items-center justify-center bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300 rounded transition" title="Hapus">
                                    <i class="fa-solid fa-trash text-[10px]"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById("dataInfo").innerText = `Menampilkan 1 - ${filtered.length} dari ${students.length} data`;
        }

        function resetForm() {
            document.getElementById("studentForm").reset();
            document.getElementById("editIndex").value = "-1";
            document.getElementById("formTitle").innerText = "Tambah Data Siswa";
            document.getElementById("btnSubmit").innerHTML = `<i class="fa-solid fa-plus text-xs"></i> Simpan`;
        }

        function editStudent(index) {
            const student = students[index];
            document.getElementById("nis").value = student.nis;
            document.getElementById("nama").value = student.nama;
            document.getElementById("kelas").value = student.kelas;
            document.querySelector(`input[name="gender"][value="${student.gender}"]`).checked = true;
            document.getElementById("tglLahir").value = student.tglLahir;
            document.getElementById("editIndex").value = index;

            document.getElementById("formTitle").innerText = "Edit Data Siswa";
            document.getElementById("btnSubmit").innerHTML = `<i class="fa-solid fa-floppy-disk text-xs"></i> Perbarui`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteStudent(index) {
            if (confirm("Apakah Anda yakin ingin menghapus data siswa ini?")) {
                students.splice(index, 1);
                renderTable();
            }
        }

        window.onload = function() {
            renderTable();

            document.getElementById("studentForm").addEventListener("submit", function(e) {
                e.preventDefault();
                const nis = document.getElementById("nis").value;
                const nama = document.getElementById("nama").value;
                const kelas = document.getElementById("kelas").value;
                const gender = document.querySelector('input[name="gender"]:checked').value;
                const tglLahir = document.getElementById("tglLahir").value;
                const editIndex = parseInt(document.getElementById("editIndex").value);

                if (editIndex === -1) {
                    students.push({ nis, nama, kelas, gender, tglLahir });
                } else {
                    students[editIndex] = { nis, nama, kelas, gender, tglLahir };
                }

                resetForm();
                renderTable();
            });

            document.getElementById("btnReset").addEventListener("click", resetForm);
            document.getElementById("searchInput").addEventListener("input", renderTable);
        };
    </script>
</body>
</html>
